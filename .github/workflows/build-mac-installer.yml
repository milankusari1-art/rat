name: Build macOS Installer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Generate Icons
      run: |
        chmod +x ./generate-icons.sh
        ./generate-icons.sh
      continue-on-error: true
    
    - name: Build Installer Package
      run: |
        chmod +x ./build-installer.sh
        ./build-installer.sh
    
    - name: Prepare Distribution
      run: |
        mkdir -p dist/mac-installer
        cp install.sh dist/mac-installer/
        cp INSTALL_MAC.md dist/mac-installer/README.md
        chmod +x dist/mac-installer/install.sh
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body_path: dist/mac-installer/README.md
        draft: false
        prerelease: false
    
    - name: Upload Installer Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: mac-installer
        path: dist/mac-installer/
        retention-days: 30
    
    - name: Deploy to Server
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        # This step would deploy to your web server
        # Example: scp, rsync, or GitHub Pages
        echo "Deployment step would go here"
